name: Bygg och släpp

# Bygger fristående versioner (kräver inte .NET på datorn) av huvudappen och klienten.
# - Manuellt (Actions → "Bygg och släpp" → Run workflow): filerna laddas upp som artefakter.
# - Vid en tagg som börjar med v (t.ex. v1.0.0): en GitHub Release skapas med filerna.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bygg klienten (en fristående exe)
        run: >
          dotnet publish SkarmStyrning.Client -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:PublishReferencesDocumentationFiles=false
          -o publish/klient

      - name: Bygg huvudappen (exe + ui-mappen)
        run: >
          dotnet publish SkarmStyrning -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:PublishReferencesDocumentationFiles=false
          -o publish/app

      - name: Packa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/klient/SkarmStyrningKlient.exe dist/SkarmStyrningKlient.exe
          Compress-Archive -Path publish/app/* -DestinationPath dist/Skarmstyrning.zip
          Get-ChildItem dist | Format-Table Name, Length

      - name: Ladda upp som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: skarmstyrning-win-x64
          path: dist/*

      - name: Skapa release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **SkarmStyrningKlient.exe** – klienten för den andra datorn (t.ex. jobbdatorn). En enda fil, kräver inte .NET.
            **Skarmstyrning.zip** – huvudappen för datorn med skärmarna. Packa upp och kör `SkarmStyrning.exe` (kräver Microsoft Edge WebView2, som finns i Windows 11).

            Windows SmartScreen kan varna eftersom filerna inte är signerade – välj *Mer information → Kör ändå*.
